[project]
name = "pdftoword"
version = "0.1.0"
description = "Web app that converts PDF and PPTX files to editable Word documents."
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "pdf2docx>=0.5.13",
    "pymupdf>=1.24",
    "python-pptx>=1.0.2",
    "python-docx>=1.2.0",
    "pillow>=10",
]

[project.urls]
Source = "https://github.com/martinslama/pdftoword"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

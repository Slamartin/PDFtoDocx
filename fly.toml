# Fly.io app definition. First deploy: `fly launch --no-deploy --copy-config` then `fly deploy --remote-only`.
app = "pdftoword"
primary_region = "ams"
swap_size_mb = 512

[build]

[env]
  LOG_LEVEL = "INFO"
  SOURCE_URL = "https://github.com/Slamartin/PDFtoDocx"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 20

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

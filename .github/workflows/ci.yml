name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The repo is public: keep the GITHUB_TOKEN read-only regardless of the repository default.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python tests/make_fixtures.py
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Build image
        run: docker build -t pdftoword .
      - name: Generate a fixture for the smoke test
        run: uv sync --locked && uv run python tests/make_fixtures.py
      - name: Smoke test the container
        run: |
          docker run -d --name pdftoword -p 8080:8080 pdftoword
          for i in $(seq 1 30); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          curl -fs http://localhost:8080/healthz
          curl -fs -o /tmp/convert.json -F file=@tests/fixtures/sample.pdf http://localhost:8080/api/convert
          cat /tmp/convert.json
          python3 -c "import json; d=json.load(open('/tmp/convert.json')); assert d['report']['pages']==2, d"
          docker logs pdftoword
          docker rm -f pdftoword

  audit:
    # Known vulnerabilities in the locked runtime dependencies block the deploy. Dev tools never ship, so
    # they are left out. A vulnerability with no fix yet can be waived with `--ignore-until-fixed <ID>`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          # `uv audit` is experimental; pin the uv the Dockerfile uses so the command cannot change under CI.
          version: "0.12.10"
      - run: uv audit --locked --no-dev --preview-features audit-command

  deploy:
    # Runs only on main after tests, the image build and the audit pass. Needs the FLY_API_TOKEN secret.
    needs: [test, docker, audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v7
      # Pinned to a commit: this job holds the Fly token, so a moved branch must not change what runs.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
